<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hoa văn damask cổ điển dập nổi, lặp kiểu so le, dùng rất nhạt trên giấy -->
  <defs>
    <g id="half">
      <path d="M80 70 C 60 60, 44 70, 46 86 C 48 98, 62 98, 64 88 C 66 80, 58 76, 54 80"/>
      <path d="M80 122 C 58 116, 40 128, 44 146 C 48 160, 66 158, 66 146 C 66 138, 58 136, 56 140"/>
      <path d="M66 104 C 56 98, 46 102, 40 112 C 50 115, 59 111, 66 104 Z"/>
      <path d="M72 52 C 64 50, 58 54, 56 60"/>
      <path d="M70 172 C 64 174, 60 178, 60 184"/>
    </g>
    <g id="motif">
      <use href="#half"/>
      <use href="#half" transform="translate(160 0) scale(-1 1)"/>
      <path d="M80 44 C 76 72, 84 128, 80 160"/>
      <path d="M80 44 C 72 34, 74 22, 80 14 C 86 22, 88 34, 80 44 Z"/>
      <path d="M80 160 C 74 168, 74 178, 80 186 C 86 178, 86 168, 80 160 Z"/>
      <circle cx="80" cy="100" r="4"/>
      <!-- hoa nhỏ ở các góc ô (so le) -->
      <g id="rosette">
        <circle cx="0" cy="0" r="4"/>
        <path d="M0 -4 C -4 -10, 4 -10, 0 -4 M4 0 C 10 -4, 10 4, 4 0 M0 4 C 4 10, -4 10, 0 4 M-4 0 C -10 4, -10 -4, -4 0"/>
      </g>
      <use href="#rosette" transform="translate(160 0)"/>
      <use href="#rosette" transform="translate(0 200)"/>
      <use href="#rosette" transform="translate(160 200)"/>
    </g>
  </defs>
  <use href="#motif" stroke="#7a6342" stroke-opacity=".13" stroke-width="1.1" transform="translate(.6 .8)"/>
  <use href="#motif" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.1"/>
</svg>
